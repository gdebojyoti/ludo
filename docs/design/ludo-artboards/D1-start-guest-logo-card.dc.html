<style>
body{margin:0}
.btn{width:100%;height:54px;border:none;border-radius:14px;background:#3B1218;color:#F3CF7E;font:600 16px Figtree,sans-serif;cursor:pointer}

.lbl{font-size:12px;font-weight:700;letter-spacing:0.1em;color:#6E5340}
.regen{width:44px;height:44px;flex:none;border-radius:12px;border:1.5px solid #A8916A;background:transparent;color:#3B1218;display:flex;align-items:center;justify-content:center;padding:0;cursor:pointer}
.regen.dk{border-color:#9C7B68;color:#F7F0DF}
.av{width:40px;height:40px;flex:none;border-radius:50%;border:2px solid #FFF8E8;box-sizing:border-box;background:#D2462E;color:#FFF8E8;display:flex;align-items:center;justify-content:center;font:600 16px Marcellus,serif}
.gbtn{width:100%;height:48px;padding:0 18px;border-radius:12px;border:1px solid #747775;background:#FFFFFF;color:#1F1F1F;display:flex;align-items:center;justify-content:center;gap:12px;font:500 15px Figtree,sans-serif;cursor:pointer}
.glogo{width:24px;height:24px;flex:none;border-radius:4px;border:1.5px dashed #9AA0A6;box-sizing:border-box;display:flex;align-items:center;justify-content:center;font:700 10px Figtree,sans-serif;color:#5F6368}
.word{font-family:Marcellus,serif;font-size:24px;letter-spacing:0.12em;color:#F3CF7E}
.sin{height:40px;padding:0 16px;flex:none;border-radius:12px;border:1.5px solid #9C7B68;background:transparent;color:#F7F0DF;font:600 14px Figtree,sans-serif;cursor:pointer}

.yd{border-radius:5px;display:flex;align-items:center;justify-content:center}
.yd span{width:56%;aspect-ratio:1/1;border-radius:50%;background:#F7F0DF}
.nav{height:64px;flex:none;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));background:#2A0C11;border-top:1px solid rgba(247,240,223,.14);box-sizing:border-box}
.tab{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:#D9C3A5;text-decoration:none;font:600 11px Figtree,sans-serif}
.tab.on{color:#F3CF7E}
.ind{position:absolute;top:0;width:28px;height:3px;border-radius:0 0 3px 3px;background:#F3CF7E}

</div>

<div style="flex: 1"></div>
