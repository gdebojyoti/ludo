body{margin:0}
.icon{width:44px;height:44px;border-radius:999px;border:1.5px solid #4A6390;background:transparent;color:#EEF4FF;display:flex;align-items:center;justify-content:center;padding:0;cursor:pointer}
.share{flex:none;height:48px;padding:0 20px;border-radius:999px;border:1.5px solid #8C9DBB;background:transparent;color:#0E1C36;display:inline-flex;align-items:center;justify-content:center;gap:8px;font:700 16px 'Nunito Sans', sans-serif;cursor:pointer}
.copy{flex:none;height:48px;padding:0 6px;border:none;background:transparent;color:#52617C;display:inline-flex;align-items:center;gap:6px;font:600 13px 'Nunito Sans', sans-serif;text-decoration:underline;text-underline-offset:3px;cursor:pointer}
.copy svg{width:15px;height:15px}
.row{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:14px;background:#172A4B;border:1px solid #2A4470}
.row.open{background:#0E1C36;border:1.5px dashed #4A6390}
.av{width:36px;height:36px;flex:none;border-radius:50%;background:#F3F7FD;color:#0E1C36;box-sizing:border-box;display:flex;align-items:center;justify-content:center;font:800 15px 'Bricolage Grotesque', sans-serif}
.av.me{box-shadow:0 0 0 3px #F4C152}
.av.away{background:#0E1C36;color:#EEF4FF;border:2px dashed #A3B6D4}
.av.none{background:#0E1C36;border:2px dashed #4A6390}
.nm{font-size:15px;font-weight:700;line-height:1.2;overflow-wrap:anywhere}
.sub{font-size:12px;line-height:16px;color:#A3B6D4}
.tag{flex:none;display:inline-flex;align-items:center;gap:4px;height:22px;padding:0 9px;border-radius:11px;font-size:12px;font-weight:800}
.tag.gold{background:#F4C152;color:#0E1C36}
.tag.muted{background:#A3B6D4;color:#0E1C36}
.btn{width:100%;height:54px;border:none;border-radius:999px;background:#F4C152;color:#0E1C36;font:700 16px 'Nunito Sans', sans-serif;box-shadow:inset 0 -4px 0 #C9952A;cursor:pointer}
@keyframes sf-fall{from{transform:translateY(0)}to{transform:translateY(150px)}}
@keyframes sf-sway{0%,100%{transform:translateX(-5px)}50%{transform:translateX(5px)}}
.sf-far{animation:sf-fall 30s linear infinite}
.sf-near{animation:sf-fall 16s linear infinite}
.sf-sway{animation:sf-sway 9s ease-in-out infinite}

.icon{background:#172A4B}
.b{position:relative;box-sizing:border-box;border:none;border-radius:999px;font:800 16px/1 'Nunito Sans', sans-serif;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;padding:0;margin:0;-webkit-tap-highlight-color:transparent;transition:transform .12s ease, background-color .12s ease}

.b .blbl{position:relative;z-index:2;display:inline-flex;align-items:center;gap:8px;white-space:nowrap}
.k-create,.k-start{width:100%;height:54px}
.k-join{height:54px;padding:0 22px;flex:none}
.k-share{height:48px;padding:0 20px;flex:none}
.b:focus-visible{outline:3px solid #3E8EDB;outline-offset:3px}
.d4 .fr{position:absolute;top:0;overflow:visible}
.d4 .fr.l{left:0}.d4 .fr.r{right:0;transform:scaleX(-1)}
.d4 .fr .a{stroke-width:1.4;stroke-linecap:round;fill:none;transition:stroke .2s ease}
.d4 .fr .c{stroke-width:1;stroke-linecap:round;fill:none;transition:stroke .2s ease}
.d4 .tw{transform-box:fill-box;transform-origin:center;transform:scale(0);animation:d4-tw 4.5s ease-in-out infinite}
.d4 .tw.t2{animation-delay:1.6s}.d4 .tw.t3{animation-delay:3s}

.d4.gold{background:#F4C152;color:#0E1C36;box-shadow:inset 0 -4px 0 #C9952A}
.d4.gold .a{stroke:#CF9D38}.d4.gold .c{stroke:#E2B44C}.d4.gold .tw{fill:#FFFFFF}
.d4.gold:active,.d4.gold.pressed{background:#E9B443;transform:translateY(2px);box-shadow:inset 0 -2px 0 #C9952A}
.d4.gold:active .a,.d4.gold.pressed .a{stroke:#D4A43F}.d4.gold:active .c,.d4.gold.pressed .c{stroke:#DFAE45}
.d4.white{background:#FFFFFF;color:#0E1C36;border:1.5px solid #8C9DBB}
.d4.white .a{stroke:#C3D2E8}.d4.white .c{stroke:#D9E3F1}.d4.white .tw{display:none}
.d4.white:active,.d4.white.pressed{background:#E8EFF8;transform:scale(.97)}
@media (prefers-reduced-motion: reduce){.b,.b *{animation:none !important;transition:none !important}}
