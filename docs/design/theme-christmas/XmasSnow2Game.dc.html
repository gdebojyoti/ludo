<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700;800&amp;family=Nunito+Sans:wght@400;600;700;800&amp;display=swap">
<style>
body{margin:0}
.icon{width:44px;height:44px;border-radius:999px;border:1.5px solid #4A6390;background:transparent;color:#EEF4FF;display:flex;align-items:center;justify-content:center;padding:0;cursor:pointer}
.board{width:360px;height:360px;box-sizing:border-box;display:grid;grid-template-columns:repeat(15,minmax(0,1fr));grid-template-rows:repeat(15,minmax(0,1fr));gap:1px;background:#C5D3E8;border-radius:10px;overflow:hidden;box-shadow:0 0 0 4px #0E1C36,0 0 0 5px #4A6390}
.yard-tl{grid-row:1/7;grid-column:1/7}.yard-tr{grid-row:1/7;grid-column:10/16}.yard-br{grid-row:10/16;grid-column:10/16}.yard-bl{grid-row:10/16;grid-column:1/7}
.ctr{grid-row:7/10;grid-column:7/10;background:#FBFDFF}
.cell{background:#FBFDFF;position:relative;display:flex;align-items:center;justify-content:center}
.c-s0,.t-s0{background:#D3283E}.c-s1,.t-s1{background:#1E8B5C}.c-s2,.t-s2{background:#F1B53A}.c-s3,.t-s3{background:#3E8EDB}
.y-s0{background-color:#D3283E;background-image:radial-gradient(circle,#DF6474 0 1.7px,transparent 2.3px),radial-gradient(circle,#DF6474 0 1.1px,transparent 1.7px);background-size:19px 19px,13px 13px;background-position:0 0,6px 9px}.y-s1{background-color:#1E8B5C;background-image:radial-gradient(circle,#5DAB8A 0 1.7px,transparent 2.3px),radial-gradient(circle,#5DAB8A 0 1.1px,transparent 1.7px);background-size:19px 19px,13px 13px;background-position:0 0,6px 9px}.y-s2{background-color:#F1B53A;background-image:radial-gradient(circle,#F5CA71 0 1.7px,transparent 2.3px),radial-gradient(circle,#F5CA71 0 1.1px,transparent 1.7px);background-size:19px 19px,13px 13px;background-position:0 0,6px 9px}.y-s3{background-color:#3E8EDB;background-image:radial-gradient(circle,#74AEE5 0 1.7px,transparent 2.3px),radial-gradient(circle,#74AEE5 0 1.1px,transparent 1.7px);background-size:19px 19px,13px 13px;background-position:0 0,6px 9px}
.star{width:15px;height:15px;fill:none;stroke:#7D93B8;stroke-width:1.7;stroke-linejoin:round}
.c-s0 .star,.c-s1 .star,.c-s2 .star,.c-s3 .star{stroke:#FFFFFF}
.yard{display:flex;align-items:center;justify-content:center;padding:18px;box-sizing:border-box}
.yin{width:104px;height:104px;flex:none;box-sizing:border-box;background:#FBFDFF;border-radius:50%;display:grid;grid-template-columns:repeat(2,34px);grid-template-rows:repeat(2,34px);place-content:center;gap:4px}
.slot{width:34px;height:34px;border-radius:50%;background:#DCE6F3;display:flex;align-items:center;justify-content:center;box-sizing:border-box}
.tok{flex:none;width:17px;height:17px;border-radius:50%;box-sizing:border-box;border:2px solid #FFFFFF;position:relative;display:block}
.tok::after{content:"";position:absolute;inset:2px;border-radius:50%;border:1.5px solid #FFFFFF}
.tok.t-s0{box-shadow:0 1.5px 0 #891A28}.tok.t-s1{box-shadow:0 1.5px 0 #145A3C}.tok.t-s2{box-shadow:0 1.5px 0 #9D7626}.tok.t-s3{box-shadow:0 1.5px 0 #285C8E}
.tok.t-s0::after{border-color:#EEADB6}.tok.t-s1::after{border-color:#AAD3C1}.tok.t-s2::after{border-color:#FAE3B4}.tok.t-s3::after{border-color:#B6D4F1}
.slot .tok{width:22px;height:22px}
.grp{position:absolute;inset:0;z-index:2}
.grp .tok{position:absolute;border-width:1.5px}
.g2 .tok,.g3 .tok,.g4 .tok{width:11px;height:11px}
.g2 .tok::after,.g3 .tok::after,.g4 .tok::after{inset:1px;border-width:1px}
.g2 .tok{left:50%;top:50%}
.g2 .tok:nth-child(1){margin:-11.4px 0 0 -8.45px}.g2 .tok:nth-child(2){margin:0.4px 0 0 -2.55px}
.g3 .tok:nth-child(1){left:50%;top:0;margin-left:-5.5px}.g3 .tok:nth-child(2){left:0;bottom:0}.g3 .tok:nth-child(3){right:0;bottom:0}
.g4 .tok:nth-child(1){left:0;top:0}.g4 .tok:nth-child(2){right:0;top:0}.g4 .tok:nth-child(3){left:0;bottom:0}.g4 .tok:nth-child(4){right:0;bottom:0}
.chipring{position:absolute;left:50%;top:50%;width:20px;height:20px;margin:-10px 0 0 -10px;border-radius:50%;display:flex;align-items:center;justify-content:center;z-index:2}
.chip-in{width:calc(100% - 6px);height:calc(100% - 6px);border-radius:50%;background:#0E1C36;color:#EEF4FF;font:700 9px/1 'Nunito Sans', sans-serif;letter-spacing:-0.02em;display:flex;align-items:center;justify-content:center}
.plq{flex:1;min-width:0;display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:14px;background:#172A4B;border:1px solid #2A4470;box-sizing:border-box;height:64px}
.plq.r{flex-direction:row-reverse;text-align:right}
.plq.turn{border:2px solid #F4C152;background:#363F4C;padding:7px 9px}
.plq.turn .av{box-shadow:0 0 0 3px #F4C152}
.av{width:36px;height:36px;flex:none;border-radius:50%;border:2px solid #FFFFFF;box-sizing:border-box;display:flex;align-items:center;justify-content:center;font:800 15px 'Bricolage Grotesque', sans-serif;color:#FFFFFF}
.av.t-s2{color:#0E1C36}
.pt{display:flex;flex-direction:column;gap:2px;min-width:0}
.nm{font-size:14px;font-weight:700;line-height:1.2;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.sub{font-size:12px;color:#A3B6D4}
.sub.on{color:#F4C152;font-weight:800}
.roll{width:88px;height:88px;flex:none;border:none;border-radius:22px;background:#FFFFFF;color:#0E1C36;font:800 24px 'Bricolage Grotesque', sans-serif;letter-spacing:0.06em;box-shadow:inset 0 -6px 0 #C9D6EA,0 0 0 3px #F4C152,0 5px 0 #06101F;cursor:pointer}
@keyframes sf-fall{from{transform:translateY(0)}to{transform:translateY(150px)}}
@keyframes sf-sway{0%,100%{transform:translateX(-5px)}50%{transform:translateX(5px)}}
.sf-far{animation:sf-fall 30s linear infinite}
.sf-near{animation:sf-fall 16s linear infinite}
.sf-sway{animation:sf-sway 9s ease-in-out infinite}
@media (prefers-reduced-motion: reduce){.sf-far,.sf-near,.sf-sway{animation:none}}
.tok.t-s0,.tok.t-s1,.tok.t-s2,.tok.t-s3{box-shadow:0 1px 2px rgba(40,10,10,.5)}
.grp .tok.t-s0,.grp .tok.t-s1,.grp .tok.t-s2,.grp .tok.t-s3{box-shadow:0 1px 2px rgba(40,10,10,.55)}
.icon{background:#172A4B}
</style>

<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    // Seats, numbered clockwise from the viewer, never colours (ADR-0006):
    // s0 = you, bottom-left · s1 = top-left · s2 = top-right · s3 = bottom-right.
    const NAMES = { s1: 'Hermione', s2: 'Bartemius', s3: 'Luna' };
    const home = (r, c) => (r === 7 && c >= 1 && c <= 5) ? 's1' : (c === 7 && r >= 1 && r <= 5) ? 's2' : (r === 7 && c >= 9 && c <= 13) ? 's3' : (c === 7 && r >= 9 && r <= 13) ? 's0' : '';
    const starts = { '6,1': 's1', '1,8': 's2', '8,13': 's3', '13,6': 's0' };
    const stars = { '2,6': 1, '6,12': 1, '12,8': 1, '8,2': 1 };
    // A realistic mid-game (same position as Desktop 1): every seat has exactly 4 tokens.
    // Tokens of different seats share a cell only on a safe cell.
    const toks = {
      '10,6': ['s0'],
      '4,6': ['s0', 's0'],
      '6,4': ['s1'],
      '0,8': ['s1'],
      '12,8': ['s1', 's3'],
      '6,12': ['s2'],
      '13,8': ['s2'],
      '7,11': ['s3']
    };
    const yardN = { s0: 1, s1: 1, s2: 2, s3: 2 };
    const tok = (x) => ({ cls: 'tok t-' + x });
    const hex = { s0: '#D3283E', s1: '#1E8B5C', s2: '#F1B53A', s3: '#3E8EDB' };
    const ringOf = (list) => {
      let at = 0; const stops = [];
      ['s0', 's1', 's2', 's3'].forEach(x => { const n = list.filter(y => y === x).length; if (!n) return; const to = at + n / list.length * 100; stops.push(hex[x] + ' ' + at.toFixed(2) + '% ' + to.toFixed(2) + '%'); at = to; });
      return 'conic-gradient(' + stops.join(', ') + ')';
    };
    const labelOf = (list) => {
      const n = {}; list.forEach(x => { n[x] = (n[x] || 0) + 1; });
      return list.length + ' tokens here: ' + Object.keys(n).map(x => n[x] + ' ' + (x === 's0' ? 'yours' : NAMES[x] + '’s')).join(', ');
    };
    const cells = [];
    for (let r = 0; r < 15; r++) for (let c = 0; c < 15; c++) {
      if ((r >= 6 && r <= 8) === (c >= 6 && c <= 8)) continue;
      const k = r + ',' + c;
      const col = home(r, c) || starts[k] || '';
      const list = toks[k] || [];
      const n = list.length;
      cells.push({ cls: 'cell' + (col ? ' c-' + col : ''), star: n < 2 && !!(stars[k] || starts[k]), tokens: n === 1 ? list.map(tok) : [], group: n >= 2 && n <= 4, gcls: 'grp g' + n, gtoks: list.map(tok), chip: n >= 5, count: n, ring: n >= 5 ? ringOf(list) : '', label: labelOf(list) });
    }
    const yards = [['s1', 'tl'], ['s2', 'tr'], ['s3', 'br'], ['s0', 'bl']].map(([s, pos]) => ({ cls: 'yard yard-' + pos + ' y-' + s, slots: [0, 1, 2, 3].map(i => ({ tok: i < yardN[s], cls: 'tok t-' + s })) }));
    return { cells, yards };
  }
}
</script>
